[project]
name = "fluid_erp"
authors = [{ name = "NRA" }]
description = "Fluid ERP: a fast, keyboard-first, Tally-style front end for ERPNext"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"
